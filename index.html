<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network+ Video Checklist</title>
<style>
  :root {
    --bg: #0b1210;
    --panel: #101a17;
    --line: #22322c;
    --ink: #dfe9e3;
    --muted: #7d9188;
    --dim: #556059;

    --high: #58e0a8;
    --high-dim: #1c3d31;
    --med: #f0b055;
    --med-dim: #3d321a;
    --low: #6f8079;
    --low-dim: #1c2320;

    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    margin: 0;
    padding: 36px 16px 90px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 26px 22px;
    box-shadow: 0 0 0 1px rgba(88, 224, 168, 0.04), 0 20px 50px rgba(0,0,0,0.35);
  }

  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 24px;
  }

  .prompt {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--high);
    margin-bottom: 8px;
    letter-spacing: 0.01em;
  }
  .prompt::before { content: "$ "; color: var(--dim); }

  h1 {
    font-size: 1.55rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    color: #f2f7f4;
    font-weight: 650;
  }

  .sub {
    font-size: 0.9rem;
    color: var(--muted);
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 0.8rem;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--low-dim);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--high), #8ff0c8);
    width: 0%;
    transition: width 0.35s ease;
  }

  .progress-count {
    white-space: nowrap;
    color: var(--high);
    font-weight: 600;
  }

  .group {
    margin-bottom: 28px;
  }

  .group-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }

  .group-head .tag {
    font-family: var(--mono);
    font-size: 0.68rem;
    padding: 3px 9px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }

  .group-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--dim);
  }

  .tag-high { background: var(--high-dim); color: var(--high); }
  .tag-med  { background: var(--med-dim);  color: var(--med); }
  .tag-low  { background: var(--low-dim);  color: var(--low); }

  .group-note {
    font-size: 0.83rem;
    color: var(--muted);
    margin: 0 0 12px;
  }

  ul.videos {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  li.video {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s ease;
  }

  li.video:hover { background: rgba(255,255,255,0.02); }

  li.video.done { opacity: 0.4; }
  li.video.done .title { text-decoration: line-through; color: var(--dim); }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    margin-top: 3px;
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    border: 1.5px solid var(--dim);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    background: transparent;
  }

  input[type="checkbox"]:checked {
    background: var(--high);
    border-color: var(--high);
  }

  input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #06120d;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .vid-main {
    flex: 1;
    min-width: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  a.title {
    color: var(--ink);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid transparent;
  }

  a.title:hover { color: var(--high); border-bottom-color: var(--high); }

  .dur {
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--dim);
    white-space: nowrap;
  }

  .why {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 2px 0 0;
    flex-basis: 100%;
  }

  .reset-row {
    text-align: center;
    margin-top: 24px;
  }

  .reset-btn {
    font-family: var(--mono);
    font-size: 0.76rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  .reset-btn:hover { border-color: var(--med); color: var(--med); }

  .layout {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  .layout .wrap { margin: 0; flex: 1; min-width: 0; }

  .sidebar {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 16px;
    box-shadow: 0 0 0 1px rgba(88, 224, 168, 0.04), 0 20px 50px rgba(0,0,0,0.35);
  }

  .panel h2 {
    font-size: 1rem;
    margin: 0 0 12px;
    color: #f2f7f4;
    font-weight: 650;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .add-row input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 5px;
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 0.85rem;
  }

  .add-row input:focus { outline: none; border-color: var(--high); }

  .add-row button {
    background: var(--high-dim);
    color: var(--high);
    border: 1px solid var(--high);
    border-radius: 5px;
    width: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
  }

  .add-row button:hover { background: var(--high); color: #06120d; }

  ul.custom-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.custom-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }

  li.custom-item:last-child { border-bottom: none; }

  li.custom-item span.txt {
    flex: 1;
    min-width: 0;
    font-size: 0.88rem;
    word-break: break-word;
  }

  li.custom-item.done span.txt {
    text-decoration: line-through;
    color: var(--dim);
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 4px;
    flex-shrink: 0;
  }

  .del-btn:hover { color: var(--med); }

  .empty-note {
    font-size: 0.82rem;
    color: var(--dim);
    font-style: italic;
  }

  .sticky-note {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 5px;
    padding: 10px;
    font-family: var(--sans);
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .sticky-note:focus { outline: none; border-color: var(--high); }

  .saved-note {
    text-align: right;
    font-size: 0.72rem;
    color: var(--dim);
    font-style: italic;
    margin-top: 6px;
    height: 1em;
  }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<div class="layout">
<div class="wrap">

  <header>
    <div class="prompt">ifconfig study-plan --priority</div>
    <h1>Professor Messer N10-008 — Study Checklist</h1>
    <div class="sub">Sorted by priority for cybersecurity study &middot; tap a title to watch, tick the box when done</div>
    <div class="progress-row">
      <span class="progress-count" id="progressCount">0 / 0 watched</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </header>

  <div id="groups"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reset all checkmarks</button>
  </div>

</div>

<div class="sidebar">

  <div class="panel">
    <h2>+ My Own Checklist</h2>
    <div class="add-row">
      <input type="text" id="customInput" placeholder="Add a task...">
      <button id="customAddBtn">+</button>
    </div>
    <ul class="custom-list" id="customList"></ul>
  </div>

  <div class="panel">
    <h2>📌 Sticky Note</h2>
    <textarea class="sticky-note" id="stickyNote" placeholder="Quick notes..."></textarea>
    <div class="saved-note" id="stickySaved"></div>
  </div>

</div>
</div>

    ]
  }
];

const STORAGE_KEY = "netplus-checklist-state";
let state = {};

function idFor(url) {
  return url.split("=").pop();
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  } catch (e) {
    state = {};
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Could not save progress", e);
  }
}

function render() {
  const container = document.getElementById("groups");
  container.innerHTML = "";
  let totalDone = 0, totalAll = 0;

  DATA.forEach(group => {
    const doneInGroup = group.videos.filter(v => state[idFor(v[2])]).length;
    totalDone += doneInGroup;
    totalAll += group.videos.length;

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    groupEl.innerHTML = `
      <div class="group-head">
        <span class="tag ${group.tagClass}">${group.label}</span>
        <span class="count">${doneInGroup}/${group.videos.length}</span>
      </div>
      <p class="group-note">${group.note}</p>
      <ul class="videos"></ul>
    `;

    const ul = groupEl.querySelector("ul.videos");

    group.videos.forEach(([title, dur, url, why]) => {
      const id = idFor(url);
      const checked = !!state[id];
      const li = document.createElement("li");
      li.className = "video" + (checked ? " done" : "");
      li.innerHTML = `
        <input type="checkbox" data-id="${id}" ${checked ? "checked" : ""}>
        <div class="vid-main">
          <a class="title" href="${url}" target="_blank" rel="noopener">${title}</a>
          <span class="dur">${dur}</span>
          ${why ? `<p class="why">${why}</p>` : ""}
        </div>
      `;
      ul.appendChild(li);
    });

    container.appendChild(groupEl);
  });

  document.getElementById("progressCount").textContent = `${totalDone} / ${totalAll} watched`;
  document.getElementById("progressFill").style.width = totalAll ? `${(totalDone / totalAll) * 100}%` : "0%";

  container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const id = e.target.dataset.id;
      state[id] = e.target.checked;
      saveState();
      render();
    });
  });
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Reset all checkmarks?")) return;
  state = {};
  saveState();
  render();
});

loadState();
render();

// --- My Own Checklist ---
const CUSTOM_KEY = "netplus-custom-checklist";
let customItems = [];

function loadCustom() {
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    customItems = raw ? JSON.parse(raw) : [];
  } catch (e) {
    customItems = [];
  }
}

function saveCustom() {
  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(customItems));
  } catch (e) {
    console.error("Could not save custom checklist", e);
  }
}

function renderCustom() {
  const list = document.getElementById("customList");
  list.innerHTML = "";

  if (customItems.length === 0) {
    list.innerHTML = '<li class="empty-note">No tasks yet — add one above.</li>';
    return;
  }

  customItems.forEach((item, i) => {
    const li = document.createElement("li");
    li.className = "custom-item" + (item.done ? " done" : "");
    li.innerHTML = `
      <input type="checkbox" data-i="${i}" ${item.done ? "checked" : ""}>
      <span class="txt"></span>
      <button class="del-btn" data-i="${i}">✕</button>
    `;
    li.querySelector(".txt").textContent = item.text;
    list.appendChild(li);
  });

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", (e) => {
      const i = Number(e.target.dataset.i);
      customItems[i].done = e.target.checked;
      saveCustom();
      renderCustom();
    });
  });

  list.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const i = Number(e.target.dataset.i);
      customItems.splice(i, 1);
      saveCustom();
      renderCustom();
    });
  });
}

function addCustomItem() {
  const input = document.getElementById("customInput");
  const text = input.value.trim();
  if (!text) return;
  customItems.push({ text, done: false });
  saveCustom();
  renderCustom();
  input.value = "";
  input.focus();
}

document.getElementById("customAddBtn").addEventListener("click", addCustomItem);
document.getElementById("customInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addCustomItem();
});

loadCustom();
renderCustom();

// --- Sticky Note ---
const NOTE_KEY = "netplus-sticky-note";
const noteEl = document.getElementById("stickyNote");
const savedEl = document.getElementById("stickySaved");
let noteSaveTimer = null;

try {
  noteEl.value = localStorage.getItem(NOTE_KEY) || "";
} catch (e) {}

noteEl.addEventListener("input", () => {
  savedEl.textContent = "";
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => {
    try {
      localStorage.setItem(NOTE_KEY, noteEl.value);
      savedEl.textContent = "saved";
    } catch (e) {
      console.error("Could not save note", e);
    }
  }, 400);
});
</script>
